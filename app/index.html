<style>
/* ================================================================================================
   GESTALTUNG
   Farben als Variablen; helles Schema wie im Gasballon-Simulator. Hochformat am Handy, auf dem
   Rechner mittig mit Handybreite.
   ================================================================================================ */
:root{--bg:#e9eef3;--card:#fff;--ink:#1d2733;--mut:#6b7886;--line:#dde3ea;--acc:#1f6fd1;--acc-soft:#e3eefb;
  --ok:#1e9e5a;--bad:#d2462f;--warn:#e08a00;--warn-soft:#fff3dd;--sky1:#cfe6fb;--sky2:#f4f9fe}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:var(--bg);font-family:"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:var(--ink);display:flex;justify-content:center}
#app{width:100%;max-width:480px;height:100%;background:var(--card);display:flex;flex-direction:column;overflow:hidden;position:relative}
button{font:inherit;border:none;background:none;color:inherit;cursor:pointer}
.top{flex:none;height:50px;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:0 14px;font-weight:700;font-size:16px;border-bottom:1px solid var(--line)}
.top .t{overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.top small{font-weight:600;color:var(--mut);font-size:12.5px;white-space:nowrap}
.top .lnk{color:var(--acc);font-weight:700;font-size:14px;white-space:nowrap}
.scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
.btns{flex:none;padding:10px 14px calc(12px + env(safe-area-inset-bottom));display:flex;gap:10px;border-top:1px solid var(--line);background:#fff}
.btn{flex:1;text-align:center;padding:12px 4px;border-radius:7px;font-weight:700;font-size:14px;white-space:nowrap}
.btn.p{background:var(--acc);color:#fff}.btn.s{background:var(--acc-soft);color:var(--acc)}
.btn:disabled{opacity:.45}
/* Auswahl */
.grp{padding:10px 16px 2px;font-size:11.5px;font-weight:700;color:var(--mut);letter-spacing:.06em;text-transform:uppercase}
.card{margin:5px 14px;border:1px solid var(--line);border-radius:7px;padding:7px 10px;display:flex;align-items:center;gap:10px;width:calc(100% - 28px);text-align:left}
.card b{font-size:14.5px;display:block}.card span{font-size:12px;color:var(--mut)}
.card.sel{border-color:var(--acc);background:var(--acc-soft)}
.card canvas{flex:none}
.card img.sil3d{flex:none;width:70px;height:30px;object-fit:contain}
.foot{padding:14px 16px 20px;font-size:11.5px;color:var(--mut);line-height:1.45}
/* Vorschau und Eckdaten */
.view{flex:none;height:30vh;min-height:180px;max-height:260px;background:linear-gradient(var(--sky1),var(--sky2));position:relative;overflow:hidden}
.view.klein{height:22vh;min-height:140px}
.pill{position:absolute;font-size:11px;color:#4b6077;background:rgba(255,255,255,.82);padding:3px 8px;border-radius:5px;pointer-events:none}
/* Schalter für die Selbstdrehung der 3D-Vorschau */
.rot{position:absolute;left:8px;top:8px;z-index:3;font-size:11.5px;font-weight:600;color:#4b6077;background:rgba(255,255,255,.88);padding:4px 9px;border-radius:5px}
.rot.on{color:var(--acc)}
.rot.rr{left:auto;right:8px}
.kpis{flex:none;display:grid;grid-template-columns:repeat(4,1fr);border-bottom:1px solid var(--line);background:#fbfcfd}
.k{padding:5px 2px 4px;text-align:center;border-right:1px solid var(--line);transition:background .6s}
.k:nth-child(4n){border-right:none}.k:nth-child(-n+4){border-bottom:1px solid var(--line)}
.k i{display:block;font-style:normal;font-size:10.5px;color:var(--mut)}.k b{font-size:14px;white-space:nowrap}
.k em{display:block;font-style:normal;font-size:10.5px;font-weight:700;min-height:13px}
.k.hl{background:#fff2d9}.up{color:var(--ok)}.dn{color:var(--bad)}
/* Schritte */
.steps{flex:none;display:flex;gap:6px;padding:8px 12px;overflow-x:auto;white-space:nowrap;border-bottom:1px solid var(--line);scrollbar-width:none}
.steps::-webkit-scrollbar{display:none}
/* Rahmen der Schrittleiste mit Pfeilen links/rechts (seitliches Scrollen auch mit Maus) */
.stepw{flex:none;position:relative}
.stepw .steps{padding:8px 34px;cursor:grab}
.stepw .steps.drag{cursor:grabbing}
.sarr{position:absolute;top:0;bottom:1px;width:34px;font-size:20px;font-weight:700;color:var(--acc);z-index:2;display:flex;align-items:center;justify-content:center}
.sarr.l{left:0;background:linear-gradient(90deg,var(--card) 60%,rgba(255,255,255,0))}
.sarr.r{right:0;background:linear-gradient(270deg,var(--card) 60%,rgba(255,255,255,0))}
.sarr.off{opacity:.25;pointer-events:none}
.chip{font-size:12px;padding:5px 10px;border-radius:5px;background:#eef2f6;color:#4a5866;flex:none}
.chip.done{background:#e3f4ea;color:#1b7a47}.chip.cur{background:var(--acc);color:#fff;font-weight:700}
.body{padding:10px 16px 16px;display:flex;flex-direction:column;gap:9px}
.q{font-size:15.5px;font-weight:700}
.lab{font-size:12.5px;color:var(--mut);font-weight:600}
.seg{display:flex;background:#eef2f6;border-radius:7px;padding:3px;gap:2px}
.seg button{flex:1;text-align:center;font-size:13px;padding:7px 2px;border-radius:5px;color:#4a5866}
.seg button.on{background:#fff;color:var(--acc);font-weight:700;box-shadow:0 1px 3px rgba(0,0,0,.12)}
.seg button:disabled{opacity:.4}
.desc{font-size:12.3px;color:#4a5866;line-height:1.35}
.sug{background:var(--acc-soft);border-radius:6px;padding:8px 11px;font-size:12.8px;line-height:1.38}.sug b{color:var(--acc)}
.info{background:#f3f5f8;border-radius:6px;padding:8px 10px;font-size:12.3px;line-height:1.38;color:#3a4a5c}
.warn{background:var(--warn-soft);border-left:4px solid var(--warn);border-radius:8px;padding:7px 10px;font-size:12.3px;line-height:1.35}
.num{display:flex;flex-direction:column;gap:3px}
.num{margin-top:8px}
.num .hd{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:13.5px}
.num .hd .lab{flex:1;line-height:1.25}
.num .hd>span:last-child{flex:none;white-space:nowrap}
.num .rg{margin-top:-2px}
.num .hd input{width:96px;text-align:right;font:inherit;font-weight:700;border:1px solid var(--line);border-radius:5px;padding:3px 6px}
.num .hd .u{color:var(--mut);font-size:12px;margin-left:4px}
.num .rg{position:relative;height:26px}
.num input[type=range]{width:100%;accent-color:var(--acc);height:26px}
.num .mark{position:absolute;top:2px;width:3px;height:22px;background:#7aa7de;border-radius:2px;pointer-events:none;transform:translateX(-1px)}
.num .sl{display:flex;justify-content:space-between;font-size:10.5px;color:var(--mut)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{font-size:12px;padding:5px 10px;border-radius:5px;background:#eef2f6;color:#4a5866}
/* Ergebnis */
.sec{font-size:11.5px;font-weight:700;color:var(--mut);letter-spacing:.06em;text-transform:uppercase;padding:10px 16px 3px}
.mg{margin:0 14px}
.mrow{display:flex;justify-content:space-between;align-items:center;font-size:12.8px;padding:3px 0;gap:6px}
.mrow.h{font-weight:700;font-size:13.2px;padding-top:7px}
.mrow .bar{flex:1;height:7px;border-radius:4px;background:#eef2f6;position:relative;overflow:hidden;min-width:30px}
.mrow .bar i{position:absolute;left:0;top:0;bottom:0;border-radius:4px}
.mrow .n{min-width:70px;text-align:right}.mrow .p{min-width:48px;text-align:right;color:var(--mut)}
.mrow.sum{border-top:1px solid #c9d3dd;margin-top:3px;font-weight:700}
.tbl{margin:0 16px}.tr{display:flex;justify-content:space-between;font-size:13px;padding:4px 0;border-bottom:1px dashed var(--line);gap:10px}.tr span{color:var(--mut)}.tr b{text-align:right}
.code{margin:6px 14px;background:#1d2733;color:#d8f0ff;font-family:Consolas,Menlo,monospace;font-size:11px;border-radius:10px;padding:9px 10px;line-height:1.42;word-break:break-all;user-select:all}
/* Rechenweg */
.rw{margin:0 14px}
.rw details{border:1px solid var(--line);border-radius:6px;margin:5px 0;background:#fbfcfd}
.rw summary{font-size:13.2px;font-weight:700;padding:8px 10px;cursor:pointer}
.rz{display:grid;grid-template-columns:1fr auto;gap:1px 8px;padding:6px 10px;border-top:1px dashed var(--line);font-size:12.2px;line-height:1.35}
.rz b{grid-column:1}.rz em{grid-column:2;grid-row:1/3;font-style:normal;font-weight:700;text-align:right;align-self:center;max-width:9.5em}
.rz span{grid-column:1;color:#4a5866;font-family:Consolas,Menlo,monospace;font-size:11.2px}
.rz i.q{grid-column:1/3;font-style:normal;font-size:10.5px;color:#8a96a3}
/* Dialog */
.modal{position:absolute;inset:0;background:rgba(20,30,45,.45);display:flex;align-items:center;justify-content:center;padding:20px;z-index:5}
.modal .box{background:#fff;border-radius:9px;padding:16px;width:100%;display:flex;flex-direction:column;gap:10px}
.modal textarea{width:100%;height:110px;font-family:Consolas,Menlo,monospace;font-size:12px;border:1px solid var(--line);border-radius:10px;padding:8px}
.toast{position:absolute;left:50%;bottom:86px;transform:translateX(-50%);background:#1d2733;color:#fff;font-size:13px;padding:8px 14px;border-radius:10px;z-index:6;opacity:0;transition:opacity .3s;pointer-events:none}
.toast.on{opacity:.95}

<body>
<div id="app"></div>
<div class="toast" id="toast"></div>

<!-- Rechenkern und feste Modelle (klassische Skripte, globale Objekte LSCore und LSModels) -->
<script src="core.js"></script>
<script src="models.js"></script>
<!-- Fahrt: Karte (Leaflet 1.9.4, lokal), Flugmodell, Wetter, Flugbildschirm -->
<script src="lib/leaflet/leaflet.js"></script>
<script src="flug.js"></script>
<script src="wetter.js"></script>
<script src="profil.js"></script>
<script src="gelaende.js"></script>
<script src="fahrt.js"></script>

<script>
/* ================================================================================================
   APP-LOGIK
   Aufbau:  1. Zustand und Hilfsfunktionen   2. Auswahl   3. Baukasten (Schritte, Felder, Vorschläge)
            4. Eckdaten-Leiste   5. Ergebnis   6. Speichern/Laden   7. Start
   Die 3D-Vorschau kommt aus viewer.js (Modul) und wird über window.LSView angesprochen.
   ================================================================================================ */
const BUILD = '2026-10-14.10';
const C = LSCore, MODELS = LSModels.MODELS;

/* ---------------- 1. Zustand und Hilfsfunktionen ---------------- */
const S = {
  screen: 'auswahl',     // 'auswahl' | 'bau' | 'ergebnis'
  d: null,               // aktueller Entwurf
  r: null,               // aktuelles Rechenergebnis
  prev: null,            // Ergebnis vor der letzten Änderung (für die Änderungsanzeige)
  step: 0,               // aktueller Schritt im Baukasten
  sel: 'luffihopper',    // markiertes Modell in der Auswahl
  origin: null,          // Modell-ID oder 'eigen', aus dem der Entwurf stammt
};
const $ = s => document.querySelector(s);
const clone = o => JSON.parse(JSON.stringify(o));
const de = (x, k = 0) => (+x).toLocaleString('de-DE', { minimumFractionDigits: k, maximumFractionDigits: k });
// Werte mit passender Genauigkeit und Einheit (g/kg/t, W/kW/MW, m³) – je nach Größe des Schiffs
const fm = kg => C.fmtMass(kg);
const fp = W => W < 1000 ? de(W) + ' W' : W < 1e6 ? de(W / 1000, W < 1e4 ? 1 : 0) + ' kW' : de(W / 1e6, 2) + ' MW';
const fv = V => V < 10 ? de(V, 2) + ' m³' : de(V) + ' m³';
const fh = h => h >= 100 ? de(h) + ' h' : de(h, 1) + ' h';
const fkm = k => k < 10 ? de(k, 1) + ' km' : de(k) + ' km';
function toast(t) { const e = $('#toast'); e.textContent = t; e.classList.add('on'); setTimeout(() => e.classList.remove('on'), 1800); }
// Längslagen der Motorpaare: Liste aus den aktuellen Lagen anlegen, bevor ein einzelner Wert gesetzt wird
function ensurePath(d, p) { if (p.startsWith('antrieb.xs.') && !Array.isArray(d.antrieb.xs)) d.antrieb.xs = S.r.nac.xp.slice(); }
function setByPath(o, p, v) { if (o === S.d) ensurePath(o, p); const k = p.split('.'); let x = o; for (let i = 0; i < k.length - 1; i++) x = x[k[i]]; x[k[k.length - 1]] = v; }
function getByPath(o, p) { return p.split('.').reduce((x, k) => x == null ? x : x[k], o); }
function recompute(keepPrev) { if (!keepPrev) S.prev = S.r; S.r = C.compute(S.d); }

/* ---------------- 2. Auswahl ---------------- */
function loadMine() { try { return JSON.parse(localStorage.getItem('ls_meine') || '[]'); } catch (e) { return []; } }
function saveMine(list) { try { localStorage.setItem('ls_meine', JSON.stringify(list)); return true; } catch (e) { return false; } }

function showAuswahl() {
  S.screen = 'auswahl';
  const mine = loadMine();
  let h = `<div class="top"><span class="t">Luftschiff wählen</span><small>${MODELS.length} Modelle</small></div><div class="scroll">`;
  let last = '';
  for (const m of MODELS) {
    if (m.gruppe !== last) { h += `<div class="grp">${m.gruppe}</div>`; last = m.gruppe; }
    const r = C.compute(m.d);
    h += `<button class="card${S.sel === m.id ? ' sel' : ''}" data-id="${m.id}"><canvas width="70" height="30" data-sil="${m.id}"></canvas><div><b>${m.d.name}</b><span>${fv(r.geo.V)} · ${m.d.gas === 'H2' ? 'H₂' : 'He'} · ${m.jahr} · ${de(r.vmax_kmh)} km/h</span></div></button>`;
  }
  if (FLOTTE.length) {
    h += `<div class="grp">Eingetragene Luftschiffe</div>`;
    FLOTTE.forEach((d, i) => { const r = C.compute(d); h += `<button class="card${S.sel === 'f' + i ? ' sel' : ''}" data-id="f${i}"><canvas width="70" height="30" data-sil="f${i}"></canvas><div><b>${escapeHtml(d.name)}</b><span>${d.erbauer ? 'von ' + escapeHtml(d.erbauer) + ' · ' : ''}${fv(r.geo.V)} · ${d.gas === 'H2' ? 'H₂' : 'He'} · ${de(r.vmax_kmh)} km/h</span></div></button>`; });
  }
  if (mine.length) {
    h += `<div class="grp">Meine Luftschiffe</div>`;
    mine.forEach((x, i) => { const dd = safeDecode(x.code); h += `<button class="card${S.sel === 'm' + i ? ' sel' : ''}" data-id="m${i}"><canvas width="70" height="30" data-sil="m${i}"></canvas><div><b>${escapeHtml(x.name)}</b><span>${dd && dd.erbauer ? 'von ' + escapeHtml(dd.erbauer) + ' · ' : ''}gespeichert ${x.datum}</span></div></button>`; });
  }
  h += `<div class="foot">Luftschiff-Simulator · Version 1 (Build ${BUILD}) · Auslegen, Speichern und Fliegen.<br>Rechnung nach Burgess, Airship Design (1927), Rumpfformen nach Gertler (Series 58). Abschätzung, kein Nachweis.</div></div>
  <div class="btns"><button class="btn s" id="bCode">Code laden</button><button class="btn s" id="bNeu">Selbst bauen</button><button class="btn p" id="bOpen">Öffnen</button></div>`;
  $('#app').innerHTML = h;
  // Vorschaubilder: zuerst der flache Umriss aus der Gertler-Kontur, dann (sobald die 3D-Vorschau geladen ist)
  // dasselbe Seitenbild wie in der Seitenansicht der Fahrt; Bilder werden je Speicher-Code zwischengespeichert
  const karten = [];
  document.querySelectorAll('canvas[data-sil]').forEach(cv => {
    const id = cv.dataset.sil, eigen = !MODELS.find(m => m.id === id);
    const d = !eigen ? MODELS.find(m => m.id === id).d : id[0] === 'f' ? FLOTTE[+id.slice(1)] : safeDecode(mine[+id.slice(1)].code);
    if (d) { drawSil(cv, C.compute(d)); karten.push([cv, d]); }
  });
  auswahlBilder(karten);
  document.querySelectorAll('.card').forEach(b => {
    b.onclick = () => { S.sel = b.dataset.id; document.querySelectorAll('.card').forEach(c => c.classList.toggle('sel', c === b)); };
    b.ondblclick = () => openSel();
  });
  $('#bOpen').onclick = openSel;
  $('#bNeu').onclick = () => startDesign(clone(C.DEFAULTS), 'eigen', true);
  $('#bCode').onclick = codeDialog;
}
// Text als Datei herunterladen (Speicher-Code, Fahrtbericht)
function download(name, text) {
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([text], { type: 'text/plain;charset=utf-8' }));
  a.download = name; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
}
// Seitenbilder aus dem 3D-Modell für die Auswahl (nacheinander, damit die Seite sofort bedienbar bleibt)
const BILDER = new Map();
function viewerBereit() {
  if (!window.LSView) return false;
  if (!viewerHost) { viewerHost = document.createElement('div'); viewerHost.style.cssText = 'position:absolute;inset:0'; viewer = window.LSView.createViewer(viewerHost); }
  return true;
}
function auswahlBilder(karten) {
  if (!viewerBereit()) { window.addEventListener('lsview', () => { if (S.screen === 'auswahl') auswahlBilder(karten); }, { once: true }); return; }
  let i = 0;
  (function naechstes() {
    if (i >= karten.length || S.screen !== 'auswahl') return;
    const [cv, d] = karten[i++], key = C.encode(d);
    if (!BILDER.has(key)) { try { BILDER.set(key, viewer.seitenbild(C.compute(d), 240).url); } catch (e) { BILDER.set(key, null); } }
    const url = BILDER.get(key);
    if (url && cv.isConnected) { const im = new Image(); im.src = url; im.className = 'sil3d'; cv.replaceWith(im); }
    setTimeout(naechstes, 0);
  })();
}
function safeDecode(code) { try { return C.decode(code); } catch (e) { return null; } }
function drawSil(cv, r) {
  const g = cv.getContext('2d'), W = 62, Rr = W / (2 * r.geo.L / r.geo.D), y0 = 14, d = r.d;
  g.fillStyle = { S: '#9aa9b9', H: '#8fb0d6', P: '#9ec3e6', O: '#e2c38c' }[d.bauweise] || '#9ec3e6';
  g.beginPath(); r.geo.profile.forEach(([x, y]) => g.lineTo(4 + x * W, y0 - Rr * y)); r.geo.profile.slice().reverse().forEach(([x, y]) => g.lineTo(4 + x * W, y0 + Rr * y)); g.fill();
  if (d.bauweise === 'S') { g.strokeStyle = 'rgba(60,70,85,.35)'; g.lineWidth = .7; for (const f of [-.5, 0, .5]) { g.beginPath(); r.geo.profile.forEach(([x, y], i) => i ? g.lineTo(4 + x * W, y0 + f * Rr * y) : g.moveTo(4 + x * W, y0)); g.stroke(); } }
  g.fillStyle = '#d65a3c'; g.beginPath(); g.moveTo(4 + W * .82, y0 - Rr * .4); g.lineTo(4 + W * .99, y0); g.lineTo(4 + W * .99, y0 - Rr - 4); g.fill();
  g.fillStyle = '#6b5a46'; if (d.gondel !== 'I' && d.gondel !== 'N') g.fillRect(4 + W * .33, y0 + Rr + (d.gondel === 'K' ? 2 : -1), W * .15, 3);
}
function openSel() {

  if (S.sel[0] === 'm' && !MODELS.find(m => m.id === S.sel)) {

  } else startDesign(clone(MODELS.find(m => m.id === S.sel).d), S.sel);
}

  { id: 'v', titel: 'Geschwindigkeit', frage: 'Mit welcher Reisegeschwindigkeit fährt es?', fields: [
      { typ: 'num', key: 'v_reise', label: 'Reisegeschwindigkeit', unit: 'km/h', min: 1, max: 160, step: 1, k: 0, vorschlag: (d, r) => Math.round(r.vmax_kmh * 0.7) },
    ], text: (d, r) => `Höchstgeschwindigkeit mit voller Leistung: ${de(r.vmax_kmh)} km/h. Bei ${de(d.v_reise)} km/h braucht es ${fp(r.Preise)} an der Welle.` },
  { id: 'ballast', titel: 'Ballast', frage: 'Wie viel Ballast kommt mit?', fields: [
      { typ: 'num', key: 'ballast', label: 'Ballast', unit: 'kg', min: 0, max: 50000, log0: true, k: 1, vorschlag: () => Math.round(lift0() * 0.05 * 10) / 10 },
    ], text: (d, r) => `Statische Gipfelhöhe nach Abwurf: ${de(Math.min(r.gipfel, 9999))} m. Vorschlag: rund 5 % des Bruttoauftriebs.` },
  { id: 'tau', titel: 'Schlepptau', frage: 'Kommt ein Schlepptau mit?', fields: [
      { typ: 'num', key: 'schlepptau', label: 'Masse Schlepptau', unit: 'kg', min: 0, max: 500, log0: true, k: 1, vorschlag: d => d.V < 50 ? 0 : Math.min(15, Math.round(d.V / 100)) },
    ], text: () => 'Das Schlepptau bremst am Boden und macht das Schiff leichter, je mehr davon aufliegt (Wirkung im Fliegen, folgt).' },
];

// Werte der Grundform setzen bzw. erkennen
function formKey(f) { for (const k in C.FORMS) { const F = C.FORMS[k]; if (['LD', 'm', 'Cp', 'r0', 'r1'].every(p => Math.abs(F[p] - f[p]) < 1e-6)) return k; } return 'eigen'; }

function showBau() {
  S.screen = 'bau';
  const st = STEPS[S.step], d = S.d;
  $('#app').innerHTML = `<div class="top"><button class="lnk" id="bBack">‹ Auswahl</button><span class="t">${escapeHtml(d.name)}</span><button class="lnk" id="bErg">Ergebnis ›</button></div>
    <div class="view" id="view"><button class="rot" id="bRot"></button><button class="rot rr" id="bCut"></button><div class="pill" style="left:8px;bottom:7px">1 Finger drehen · 2 Finger zoomen</div><div class="pill" id="dim" style="right:8px;bottom:7px"></div></div>
    <div class="kpis" id="kpis"></div>
    <div class="stepw"><button class="sarr l" id="sL" aria-label="Schritte nach links">‹</button><div class="steps" id="steps">${STEPS.map((s, i) => `<button class="chip ${i === S.step ? 'cur' : i < S.step ? 'done' : ''}" data-i="${i}">${i < S.step ? '✓ ' : ''}${s.titel}</button>`).join('')}</div><button class="sarr r" id="sR" aria-label="Schritte nach rechts">›</button></div>
    <div class="scroll"><div class="body" id="body"></div></div>
    <div class="btns"><button class="btn s" id="bPrev"${S.step === 0 ? ' disabled' : ''}>‹ Zurück</button><button class="btn s" id="bSug">Vorschlag</button><button class="btn p" id="bNext">${S.step === STEPS.length - 1 ? 'Fertig ✓' : 'Weiter ›'}</button></div>`;
  $('#bBack').onclick = showAuswahl;
  $('#bErg').onclick = showErgebnis;
  $('#bPrev').onclick = () => { S.step--; showBau(); };
  $('#bNext').onclick = () => { if (S.step < STEPS.length - 1) { S.step++; showBau(); } else showErgebnis(); };
  $('#bSug').onclick = applySuggestions;
  document.querySelectorAll('#steps .chip').forEach(b => b.onclick = () => { if (stepsDragged) return; S.step = +b.dataset.i; showBau(); });
  stepScroller($('#steps'), $('#sL'), $('#sR'));
  { const bar = $('#steps'), cur = $('#steps .cur'); bar.scrollLeft = cur.offsetLeft - (bar.clientWidth - cur.offsetWidth) / 2; }
  mountView($('#view'));
  renderBody(); renderKpis(true);
}

/* Schrittleiste seitlich scrollen: Wischen (Touch), Pfeile ‹ ›, Mausrad und Ziehen mit der Maus.
   Die Pfeile werden blass, wenn es in ihre Richtung nicht weitergeht. Nach einem Ziehen wird der
   Klick auf einen Schritt unterdrückt (stepsDragged), damit man nicht versehentlich springt. */
let stepsDragged = false;
function stepScroller(bar, bl, br) {
  const upd = () => { bl.classList.toggle('off', bar.scrollLeft <= 2); br.classList.toggle('off', bar.scrollLeft >= bar.scrollWidth - bar.clientWidth - 2); };
  bl.onclick = () => bar.scrollBy({ left: -bar.clientWidth * 0.6, behavior: 'smooth' });
  br.onclick = () => bar.scrollBy({ left: bar.clientWidth * 0.6, behavior: 'smooth' });
  bar.addEventListener('scroll', upd, { passive: true });
  // Mausrad: senkrechtes Drehen schiebt die Leiste waagerecht
  bar.addEventListener('wheel', e => { if (Math.abs(e.deltaY) > Math.abs(e.deltaX)) { bar.scrollLeft += e.deltaY; e.preventDefault(); } }, { passive: false });
  // Ziehen mit der Maus (Touch scrollt der Browser selbst); Ereignisse nur an der Leiste, damit nichts liegen bleibt
  let x0 = null, s0 = 0;
  bar.onpointerdown = e => { if (e.pointerType !== 'mouse') return; x0 = e.clientX; s0 = bar.scrollLeft; stepsDragged = false; };
  bar.onpointermove = e => { if (x0 === null) return; const dx = e.clientX - x0;
    if (!stepsDragged && Math.abs(dx) > 5) { stepsDragged = true; bar.classList.add('drag'); bar.setPointerCapture(e.pointerId); }
    if (stepsDragged) bar.scrollLeft = s0 - dx; };
  bar.onpointerup = bar.onpointercancel = () => { x0 = null; bar.classList.remove('drag'); setTimeout(() => { stepsDragged = false; }, 0); };
  setTimeout(upd, 0);
}

function renderBody() {
  const st = STEPS[S.step], d = S.d, r = S.r;
  let h = `<div class="q">${st.frage}</div>`;
  st.fields.forEach((f, i) => {
    if (f.when && !f.when(d)) return;
    if (f.label && f.typ !== 'num') h += `<div class="lab">${f.label}</div>`;   // Zahlenfelder: Überschrift steht in der Wertzeile
    if (f.typ === 'seg' || f.typ === 'chips') {
      const opts = typeof f.opts === 'function' ? f.opts(d) : f.opts;
      const cur = f.key === '_form' ? formKey(d.form) : f.key === '_mpaar' ? (C.nacelles(d.antrieb).mitte === 2 ? '1' : '0') : f.key === 'antrieb.ungerade' ? (d.antrieb.ungerade || 'U') : f.key === '_ruder' ? (d.ltw.pendel ? 'P' : 'K') : f.key === '_aufh' ? ((r.gondel.ga || 0) > 0 ? 'A' : 'I') : (getByPath(d, f.key) ?? (f.def ? f.def(d) : undefined));
      h += `<div class="${f.typ === 'seg' ? 'seg' : 'chips'}">` + opts.map(([v, t, dis]) => `<button data-f="${i}" data-v="${v}"${(f.typ === 'seg' && String(cur) === String(v)) ? ' class="on"' : ''}${dis ? ' disabled title="folgt"' : ''}>${t}</button>`).join('') + '</div>';
    } else if (f.typ === 'num') {
      const v = getByPath(d, f.key) ?? (f.def ? f.def() : 0), sv = f.vorschlag ? f.vorschlag(d, r) : null;
      // Anzeige: Prozent (pct), Meter ab Bug für Längslagen (lfrac, gespeichert als Anteil der Länge) oder Wert mit Einheit
      const Lm = r.geo.L, sh = x => f.pct ? de(x * 100, f.k) + ' %' : f.lfrac ? de(x * Lm, 1) + ' m' : fmtNum(x, f);
      const show = f.pct ? de(v * 100, f.k) : f.lfrac ? de(v * Lm, 1) : fmtNum(v, f);
      h += `<div class="num"><div class="hd"><span class="lab">${(typeof f.label === 'function' ? f.label(d) : f.label) || ''}</span><span><input type="text" inputmode="decimal" data-f="${i}" value="${show}"><span class="u">${f.pct ? '%' : f.lfrac ? 'm ab Bug' : (f.unit || '')}</span></span></div>
        <div class="rg"><input type="range" min="0" max="1000" step="1" data-f="${i}" value="${toSlider(v, f)}">${sv != null && isFinite(sv) ? `<div class="mark" style="left:${toSlider(sv, f) / 10}%" title="Vorschlag"></div>` : ''}</div>
        <div class="sl"><span>${sh(f.min)}</span><span>${sv != null && isFinite(sv) ? '▲ Vorschlag ' + sh(sv) + (f.pct || f.lfrac ? '' : ' ' + (f.unit || '')) : ''}</span><span>${sh(f.max)}</span></div></div>`;
    }
  });
  if (st.text) h += `<div class="${st.id === 'antrieb' || st.id === 'ltw' ? 'sug' : 'info'}">${st.text(d, r)}</div>`;
  for (const w of r.warn) h += `<div class="warn">⚠ ${w}</div>`;
  (r.vorschlaege || []).forEach((v, i) => { h += `<button class="btn s" data-vs="${i}">✓ ${v.text}</button>`; });
  $('#body').innerHTML = h;
  // Vorschläge aus Warnungen übernehmen (z. B. Nasenlatten)
  $('#body').querySelectorAll('button[data-vs]').forEach(b => b.onclick = () => { Object.assign(d, clone(r.vorschlaege[+b.dataset.vs].set)); change(); toast('Übernommen'); });
  // Ereignisse der Felder
  $('#body').querySelectorAll('button[data-f]').forEach(b => b.onclick = () => {
    const f = st.fields[+b.dataset.f]; let v = b.dataset.v;
    if (f.key === '_form') { if (v !== 'eigen') Object.assign(d.form, clone(C.FORMS[v]), { name: undefined }); change(); return; }
    // Sonderfall Motorpaar in der Mittelgondel: gespeichert als Zahl der Gondeln = Motoren − 1
    if (f.key === '_ruder') { if (v === 'P') d.ltw.pendel = true; else delete d.ltw.pendel; change(); return; }
    // Aufhängung innen ⇒ Gondel direkt an der Hülle (Abstand 0); außen ⇒ an Seilen mit Vorschlagsabstand 0,3 · Ø (mind. 2 m)
    if (f.key === '_aufh') { d.gabstand = v === 'I' ? 0 : Math.max(2, Math.round(0.3 * r.geo.D * 10) / 10); change(); return; }
    if (f.key === '_mpaar') { if (v === '1') d.antrieb.gondeln = d.antrieb.n - 1; else delete d.antrieb.gondeln; change(); return; }
    if (f.num || f.typ === 'chips') v = +v;
    setByPath(d, f.key, v);
    if (f.key === 'ltw.n') d.ltw.anord = ({ 1: '|', 2: '|', 3: 'Y' })[v] || '+';
    change();
  });
  $('#body').querySelectorAll('input[type=range]').forEach(inp => {
    inp.oninput = () => { const f = st.fields[+inp.dataset.f]; if (f.key === 'ltw.faktor') delete d.ltw.A_ebene; setByPath(d, f.key, roundTo(fromSlider(+inp.value, f), f)); change(true); };
    inp.onchange = () => renderBody();
  });
  $('#body').querySelectorAll('input[type=text]').forEach(inp => inp.onchange = () => {
    const f = st.fields[+inp.dataset.f]; let v = parseFloat(inp.value.replace(/\./g, '').replace(',', '.'));
    if (!isFinite(v)) return renderBody();
    if (f.pct) v /= 100;
    if (f.lfrac) v /= S.r.geo.L;          // Eingabe in m ab Bug ⇒ Anteil der Länge
    if (f.key === 'ltw.faktor') delete d.ltw.A_ebene;
    setByPath(d, f.key, Math.max(f.min, Math.min(f.max, v))); change();
  });
}
// Regler: linear, logarithmisch (log) oder logarithmisch mit Null (log0)
function toSlider(v, f) {
  if (f.log) return Math.round(1000 * Math.log(Math.max(v, f.min) / f.min) / Math.log(f.max / f.min));
  if (f.log0) { if (v <= 0) return 0; const lo = Math.max(f.max / 1e5, 0.01); return Math.round(50 + 950 * Math.log(Math.max(v, lo) / lo) / Math.log(f.max / lo)); }
  return Math.round(1000 * (v - f.min) / (f.max - f.min));
}
function fromSlider(s, f) {
  if (f.log) return f.min * Math.pow(f.max / f.min, s / 1000);
  if (f.log0) { if (s < 50) return 0; const lo = Math.max(f.max / 1e5, 0.01); return lo * Math.pow(f.max / lo, (s - 50) / 950); }
  return f.min + (f.max - f.min) * s / 1000;
}
function roundTo(v, f) { if (f.step) return Math.round(v / f.step) * f.step; const p = Math.pow(10, Math.floor(Math.log10(Math.max(Math.abs(v), 1e-9))) - 2); return Math.round(v / p) * p; }
function fmtNum(v, f) { if (f.step && f.step >= 1) return de(v); const a = Math.abs(v); return de(v, a >= 100 ? 0 : a >= 10 ? 1 : a >= 1 ? 2 : 3); }
function escapeHtml(s) { return String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]); }

// Nach jeder Änderung: neu rechnen, Vorschau und Eckdaten erneuern; Feldbereich nur beim Loslassen neu zeichnen
function change(live) {
  recompute();
  updateView();
  renderKpis();
  if (!live) renderBody();
  else { const t = document.querySelector('#body .sug, #body .info'), st = STEPS[S.step]; if (t && st.text) t.innerHTML = st.text(S.d, S.r); }
}
// „Vorschlag“: alle Felder des Schritts mit Vorschlag auf diesen Wert setzen
function applySuggestions() {
  const st = STEPS[S.step]; let n = 0;
  for (const f of st.fields) if (f.typ === 'num' && f.vorschlag && (!f.when || f.when(S.d))) { const v = f.vorschlag(S.d, S.r); if (isFinite(v)) { setByPath(S.d, f.key, roundTo(v, f)); n++; } }
  if (st.id === 'form' && formKey(S.d.form) === 'eigen') { Object.assign(S.d.form, clone(C.FORMS[S.d.bauweise === 'S' ? 'zeppelin' : 'blimp'])); n++; }
  change(); toast(n ? 'Vorschlag übernommen' : 'Kein Vorschlag in diesem Schritt');
}

// Gerüst und Innenaufbau in Worten (Schritt Bauweise)
function strukturText(d, r) {
  const st = r.struktur, L = r.geo.L, l = r.leer;
  if (d.bauweise === 'S') return `<b>Gerüst:</b> ${st.traeger} Längsträger (Feldbreite ${de(Math.PI * r.geo.D / st.traeger, 1)} m), ${st.zellen} Gaszellen (Ringabstand ${de(L / st.zellen, 1)} m) ⇒ Träger ${fm(l.laengstraeger)}, Ringe und Netze ${fm(l.ringe)}, Zellen ${fm(l.zellen)}. Mehr Längsträger: schmalere Felder, leichtere Netze, weniger Ausbeulen der Außenhülle, aber mehr Knoten. Mehr Zellen: kürzere Felder zwischen den Ringen, ein Zellenausfall kostet weniger (1 von ${st.zellen} = ${de(100 / st.zellen)} % Auftrieb).<br>`;
  if (d.bauweise === 'H') return `<b>Kiel:</b> ${({ A: 'außen unter der Hülle', I: 'innen in der Hülle', G: 'Innengerüst aus Dreiecksrahmen' })[st.kiel]}, ${({ S: 'Stahlrohr', A: 'Aluminium', C: 'CFK' })[st.kwerk]}, ${de(st.kiellaenge * 100)} % der Länge ⇒ ${fm(l.kiel)}. ${st.nB} Ballonets ${fm(l.ballonet || 0)}${st.nB >= 2 ? ' – vorn und hinten getrennt füllbar: so lässt sich das Schiff im Flug trimmen' : ''}.<br>`;
  if (d.bauweise === 'P') return `<b>Ballonets:</b> ${st.nB} Stück, zusammen ${de(d.ballonet ?? 25)} % des Volumens, ${fm(l.ballonet || 0)}${st.nB >= 2 ? '. Vorn und hinten getrennt füllbar: Trimm im Flug (Bug hoch/tief ohne Ruder)' : ''}. Gondel ${(r.gondel.ga || 0) > 0 ? 'außen an ' + (r.gondel.ropes ? r.gondel.ropes.n : '') + ' Seilen' : 'innen an Lastgurten (Katenarie) aufgehängt, direkt an der Hülle'}.<br>`;
  return '';
}
// Trimm in einem Satz: Lage von Schwerpunkt und Auftriebsmitte, Winkel ohne Ruder
function trimText(r) {
  const t = r.trim, L = r.geo.L, m = x => de(x * L, 1) + ' m';
  const lage = Math.abs(t.theta) < 0.5 ? 'ausgetrimmt' : `${de(Math.abs(t.theta), 1)}° Bug ${t.dx > 0 ? 'hoch' : 'tief'}`;
  return `<b>Trimm:</b> Auftriebsmitte bei ${m(t.xB)}, Schwerpunkt bei ${m(t.xG)} ab Bug ⇒ ${lage}.` + (t.xReq != null ? ` Für Gleichgewicht gehört die ${r.d.gondel === 'I' ? 'Raummitte' : 'Gondelmitte'} auf ${m(t.xReq)} (möglich ${m(t.lo)} bis ${m(t.hi)}).` : '') + '<br>';
}

/* ---------------- 4. Eckdaten-Leiste ---------------- */
function renderKpis(noDelta) {
  const r = S.r, p = noDelta ? null : S.prev;
  const items = [
    ['Volumen', fv(r.geo.V), null],
    ['Leermasse', fm(r.mLeer), p && [r.mLeer - p.mLeer, false, fm]],
    ['Nutzlast frei', fm(r.frei), p && [r.frei - p.frei, true, fm]],
    ['Gipfelhöhe', (r.gipfel > 6000 ? '6.000+' : de(r.gipfel)) + ' m', p && [Math.min(r.gipfel, 6000) - Math.min(p.gipfel, 6000), true, x => de(x) + ' m']],
    ['v max', de(r.vmax_kmh) + ' km/h', p && [r.vmax_kmh - p.vmax_kmh, true, x => de(x, 1) + ' km/h']],
    ['Reise', de(r.v_reise_kmh) + ' km/h', p && [r.v_reise_kmh - p.v_reise_kmh, true, x => de(x) + ' km/h']],
    ['Fahrdauer', fh(r.dauer_h), p && [r.dauer_h - p.dauer_h, true, x => de(x, 1) + ' h']],
    ['Reichweite', fkm(r.reichweite_km), p && [r.reichweite_km - p.reichweite_km, true, fkm]],
  ];
  // Änderung zur letzten Entscheidung: grün = besser, rot = schlechter; nur deutliche Änderungen zeigen
  $('#kpis').innerHTML = items.map(([t, v, dl]) => {
    let em = '<em></em>', hl = false;
    if (dl && isFinite(dl[0]) && Math.abs(dl[0]) > 1e-6) {
      const txt = dl[2](Math.abs(dl[0]));
      if (!/^0([,.]0+)? /.test(txt) && !/^0 /.test(txt)) { hl = true; em = `<em class="${(dl[0] > 0) === dl[1] ? 'up' : 'dn'}">${dl[0] > 0 ? '+' : '−'}${txt}</em>`; }
    }
    return `<div class="k${hl ? ' hl' : ''}"><i>${t}</i><b>${v}</b>${em}</div>`;
  }).join('');
  const r0 = S.r.geo; const dim = $('#dim'); if (dim) dim.textContent = `L ${de(r0.L, r0.L < 10 ? 2 : 1)} m · D ${de(r0.D, r0.D < 10 ? 2 : 1)} m`;
}

/* ---------------- 5. Ergebnis ---------------- */
function showErgebnis() {
  S.screen = 'ergebnis';
  const r = S.r, d = S.d, e = r.leer, z = r.zuladung, L0 = r.lift0;
  const G = [];   // Gruppen der Massenliste je nach Bauweise
  if (e.laengstraeger) G.push(['Struktur', '#5b6f8a', [['Gerüst: Längsträger, Laufgang', e.laengstraeger], ['Gerüst: Ringe, Drähte, Netze', e.ringe]]]);
  if (e.kiel) G.push(['Struktur', '#5b6f8a', [['Kiel / Innengerüst', e.kiel], ['Nasenlatten', e.nasenlatten || 0]]]);
  else if (e.nasenlatten) G.push(['Struktur', '#5b6f8a', [[d.latten ? `Nasenlatten (${d.latten.n} Stück × ${de(d.latten.len, 1)} m)` : 'Nasenlatten', e.nasenlatten]]]);
  G.push(['Hülle und Gas', '#5b8fd6', [['Hülle außen', e.huelle], ['Gaszellen', e.zellen || 0], ['Ballonets', e.ballonet || 0], ['Gebläse', e.geblaese || 0]]]);
  G.push(['Leitwerk', '#d65a3c', [[`Flossen und Ruder (${d.ltw.n} Stück)`, e.leitwerk]]]);
  G.push(['Gondel', '#7d6bd1', [[{ K: 'Korb', F: 'Gondel', I: 'Steuergondel, Räume im Rumpf', R: 'RC-Kapsel', N: 'keine' }[d.gondel], e.gondel], ['Aufhängung', e.aufhaengung || 0], ['Seile', e.seile || 0]]]);
  G.push(['Antrieb', '#c55d9d', [[`Motoren, Propeller (${d.antrieb.n} Stück${d.antrieb.lage === 'R' ? ', ' + C.nacelles(d.antrieb).g + ' Motorgondeln' : ''})`, e.antrieb]]]);
  G.push(['Ausrüstung', '#8a96a3', [['Armaturen, Ventile, Ballastanlage', e.armaturen || 0], ['Elektrik', e.elektrik || 0], ['Avionik', e.avionik || 0]]]);
  const ZG = [['Zuladung', '#3fa37a', [[d.antrieb.art === 'V' ? 'Kraftstoff' : 'Akku', z.energie], [`Personen (${(d.crew || 0) + (d.pax || 0)} × ${de(d.m_person)} kg)`, z.personen], ['Nutzlast', z.nutzlast], ['Ballast', z.ballast], ['Schlepptau', z.schlepptau]]]];
  const line = (n, v, c) => `<div class="mrow"><span>${n}</span><span class="bar"><i style="width:${Math.min(100, v / L0 * 250)}%;background:${c}"></i></span><span class="n">${fm(v)}</span><span class="p">${de(v / L0 * 100, 1)} %</span></div>`;
  const block = gs => gs.map(([g, c, it]) => { it = it.filter(x => x[1] > 0); if (!it.length) return ''; return `<div class="mrow h"><span>${g}</span><span>${fm(it.reduce((s, x) => s + x[1], 0))}</span></div>` + it.map(([n, v]) => line(n, v, c)).join(''); }).join('');
  const code = C.encode(d);
  $('#app').innerHTML = `<div class="top"><button class="lnk" id="bBack">‹ Auswahl</button><span class="t">${escapeHtml(d.name)}</span><button class="lnk" id="bEdit">Bearbeiten</button></div>
    <div class="view klein" id="view"><button class="rot" id="bRot"></button><button class="rot rr" id="bCut"></button><div class="pill" style="left:8px;bottom:7px">drehen · zoomen</div><div class="pill" id="dim" style="right:8px;bottom:7px"></div></div>
    <div class="kpis" id="kpis"></div>
    <div class="scroll">
      ${r.warn.map(w => `<div class="warn" style="margin:8px 14px 0">⚠ ${w}</div>`).join('')}
      ${(r.vorschlaege || []).map((v, i) => `<button class="btn s" data-vs="${i}" style="margin:6px 14px 0;width:calc(100% - 28px)">✓ ${v.text}</button>`).join('')}
      <div class="sec">Massen · Bruttoauftrieb ${fm(L0)}</div>
      <div class="mg">${block(G)}<div class="mrow sum"><span>Leermasse</span><span>${fm(r.mLeer)} · ${de(r.mLeer / L0 * 100, 1)} %</span></div>${block(ZG)}<div class="mrow sum"><span>${r.frei >= 0 ? 'Noch frei' : 'Fehlt'}</span><span style="color:${r.frei >= 0 ? 'var(--ok)' : 'var(--bad)'}">${fm(Math.abs(r.frei))}</span></div></div>
      <div class="sec">Eckdaten</div>
      <div class="tbl">
        <div class="tr"><span>Bauweise · Gas</span><b>${{ S: 'Starr', H: 'Halbstarr', P: 'Prall', O: 'Prall, Appendix offen' }[d.bauweise]} · ${d.gas === 'H2' ? 'H₂' : 'He'} ${de(d.reinheit * 100, 1)} %</b></div>
        <div class="tr"><span>Form</span><b>${{ albacore: 'Albacore', zeppelin: 'Zeppelin', blimp: 'Blimp', eigen: 'Eigene' }[formKey(d.form)]} · L/D ${de(d.form.LD, 2)} · Cp ${de(d.form.Cp, 2)}</b></div>
        <div class="tr"><span>Länge × Durchmesser</span><b>${de(r.geo.L, r.geo.L < 10 ? 2 : 1)} m × ${de(r.geo.D, r.geo.D < 10 ? 2 : 1)} m</b></div>
        <div class="tr"><span>Oberfläche · Hüllenstoff</span><b>${de(r.geo.S, r.geo.S < 10 ? 1 : 0)} m² · ${de(d.huelle_gm2)} g/m²</b></div>
        <div class="tr"><span>Prallhöhe · Füllung am Boden</span><b>${de(r.prallhoehe)} m · ${de(r.fill * 100)} %</b></div>
        <div class="tr"><span>Antrieb</span><b>${d.antrieb.n} Motoren × ${fp(d.antrieb.kW * 1000)} ${{ E: 'elektrisch', V: 'Verbrenner', S: 'Solar + Akku', H: 'Hybrid' }[d.antrieb.art]}</b></div>
        <div class="tr"><span>v max · Reise · Leistung Reise</span><b>${de(r.vmax_kmh)} · ${de(r.v_reise_kmh)} km/h · ${fp(r.Preise)}</b></div>
        <div class="tr"><span>Fahrdauer · Reichweite (Windstille)</span><b>${fh(r.dauer_h)} · ${fkm(r.reichweite_km)}</b></div>
        <div class="tr"><span>Trimm: Schwerpunkt · Auftriebsmitte</span><b>${de(r.trim.xG * r.geo.L, 1)} · ${de(r.trim.xB * r.geo.L, 1)} m ab Bug · ${Math.abs(r.trim.theta) < 0.5 ? 'ausgetrimmt' : de(Math.abs(r.trim.theta), 1) + '° Bug ' + (r.trim.dx > 0 ? 'hoch' : 'tief')}</b></div>
        <div class="tr"><span>Lage ${d.gondel === 'I' ? 'Räume' : 'Gondel'} (Mitte)</span><b>${de(r.trim.gx * r.geo.L, 1)} m ab Bug</b></div>
        <div class="tr"><span>Statische Gipfelhöhe</span><b>${de(Math.min(r.gipfel, 9999))} m</b></div>
        <div class="tr"><span>Leitwerk (Burgess)</span><b>${d.ltw.n} Flossen · ${de(r.tail.Atot, r.tail.Atot < 10 ? 2 : 1)} m²${r.tail.elevator ? '' : ' · ohne Höhenruder'}</b></div>
        <div class="tr"><span>Widerstandsbeiwert C<sub>D</sub> (V<sup>2/3</sup>)</span><b>${de(r.drag.total, 4)} (Rumpf ${de(r.drag.hull, 4)})</b></div>
      </div>
      <div class="sec">Rechenweg</div>
      <div class="rw">${C.rechenweg(r).map(sec => `<details><summary>${sec.titel}</summary>${sec.zeilen.map(z => `<div class="rz"><b>${z[0]}</b><span>${escapeHtml(z[1])}</span><em>${z[2]}</em>${z[3] ? `<i class="q">Quelle: ${escapeHtml(z[3])}</i>` : ''}</div>`).join('')}</details>`).join('')}</div>
      <div class="sec">Speicher-Code</div>
      <div class="code" id="code">${escapeHtml(code)}</div>
      <button class="btn s" id="bTxt" style="margin:0 14px;width:calc(100% - 28px)">Als Textdatei (.txt) herunterladen</button>
      <div class="foot">Abschätzung nach Burgess (1927) und Gertler (Series 58), kein Festigkeits- oder Zulassungsnachweis.</div>
    </div>
    <div class="btns"><button class="btn s" id="bCopy">Kopieren</button><button class="btn s" id="bSave">Speichern</button><button class="btn s" id="bShare">Teilen</button><button class="btn p" id="bFly">Fliegen</button></div>`;
  $('#bBack').onclick = showAuswahl;
  $('#bEdit').onclick = () => { S.prev = null; showBau(); };
  $('#bFly').onclick = () => showStart();   // Fahrt vorbereiten (fahrt.js)
  $('#bCopy').onclick = () => copy(code);
  $('#bShare').onclick = () => { if (navigator.share) navigator.share({ title: d.name, text: code }).catch(() => {}); else copy(code); };
  $('#bSave').onclick = saveDialog;
  $('#bTxt').onclick = () => download((d.name || 'Luftschiff').replace(/[^\wäöüÄÖÜß\- ]+/g, '').trim() + '.txt',
    d.name + (d.erbauer ? ' (Erbauer: ' + d.erbauer + ')' : '') + '\nLuftschiff-Simulator, Build ' + BUILD + ', ' + new Date().toLocaleDateString('de-DE') + '\n\n' + code + '\n');
  document.querySelectorAll('button[data-vs]').forEach(b => b.onclick = () => { Object.assign(S.d, clone(S.r.vorschlaege[+b.dataset.vs].set)); recompute(); showErgebnis(); toast('Übernommen'); });
  mountView($('#view'));
  renderKpis(true);
}
function copy(t) { (navigator.clipboard ? navigator.clipboard.writeText(t) : Promise.reject()).then(() => toast('Code kopiert'), () => toast('Kopieren nicht möglich – Code markieren')); }

/* ---------------- 6. Speichern und Laden ---------------- */
function erbauerGespeichert() { try { return localStorage.getItem('ls_erbauer') || ''; } catch (e) { return ''; } }
function saveDialog() {
  const fld = 'font:inherit;padding:8px;border:1px solid var(--line);border-radius:5px';
  modal(`<b>Unter welchem Namen speichern?</b><input id="mName" style="${fld}" value="${escapeHtml(S.d.name)}">
    <span class="desc">Erbauer (dein Name; unterscheidet gleiche Schiffe verschiedener Erbauer)</span><input id="mUser" style="${fld}" value="${escapeHtml(S.d.erbauer || erbauerGespeichert())}">`, () => {
    const name = $('#mName').value.trim() || 'Ohne Namen'; S.d.name = name;
    const user = $('#mUser').value.trim(); if (user) { S.d.erbauer = user; try { localStorage.setItem('ls_erbauer', user); } catch (e) {} } else delete S.d.erbauer;
    const list = loadMine().filter(x => x.name !== name);
    list.unshift({ name, code: C.encode(S.d), datum: new Date().toLocaleDateString('de-DE') });
    toast(saveMine(list) ? 'Gespeichert unter „Meine Luftschiffe“' : 'Speichern auf diesem Gerät nicht möglich');
    showErgebnis();
  });
}
function codeDialog() {
  modal(`<b>Speicher-Code einfügen</b><textarea id="mCode" placeholder="LS1|N:…  (auch ganzer Text, der Code wird herausgesucht)"></textarea>
    <label class="btn s" style="text-align:center;cursor:pointer">Textdatei (.txt) öffnen<input type="file" id="mFile" accept=".txt,text/plain" style="display:none"></label>`, () => {
    try { startDesign(C.decode($('#mCode').value), 'eigen'); } catch (e) { toast('Code nicht lesbar: ' + e.message); }
  });
  $('#mFile').onchange = e => { const f = e.target.files[0]; if (!f) return; const rd = new FileReader(); rd.onload = () => { $('#mCode').value = rd.result; }; rd.readAsText(f); };
}
function modal(inner, ok) {
  const m = document.createElement('div'); m.className = 'modal';
  m.innerHTML = `<div class="box">${inner}<div style="display:flex;gap:10px"><button class="btn s" id="mNo">Abbrechen</button><button class="btn p" id="mOk">OK</button></div></div>`;
  $('#app').appendChild(m);
  m.querySelector('#mNo').onclick = () => m.remove();
  m.querySelector('#mOk').onclick = () => { ok(); m.remove(); };   // erst Eingaben lesen, dann schließen
}

/* ---------------- 3D-Vorschau einhängen ----------------
   Die Vorschau bleibt erhalten und wird nur in den jeweiligen Rahmen umgehängt. */
let viewer = null, viewerHost = null;
function mountView(el) {
  if (!window.LSView) { el.insertAdjacentHTML('afterbegin', '<div class="pill" style="left:8px;top:8px">3D wird geladen …</div>'); window.addEventListener('lsview', () => mountView(el), { once: true }); return; }
  if (!viewerHost) { viewerHost = document.createElement('div'); viewerHost.style.cssText = 'position:absolute;inset:0'; viewer = window.LSView.createViewer(viewerHost); }
  el.insertBefore(viewerHost, el.firstChild);
  wireRot();
  updateView();
}
function updateView() { if (viewer && S.r) viewer.update(S.r); }
// Selbstdrehung ein/aus; die Wahl bleibt im Browser gespeichert
function rotOn() { try { return localStorage.getItem('ls_drehen') !== '0'; } catch (e) { return true; } }
function wireRot() {
  const b = $('#bRot'); if (!b) return;
  const show = () => { const on = rotOn(); b.textContent = on ? '⟳ Drehen: an' : '⟳ Drehen: aus'; b.classList.toggle('on', on); if (viewer) viewer.setAutoRotate(on); };
  b.onclick = () => { try { localStorage.setItem('ls_drehen', rotOn() ? '0' : '1'); } catch (e) {} show(); };
  show();
  // Schnittansicht: vordere Hälfte der Hülle weg, Gerüst, Gaszellen, Ballonets und Kiel sichtbar
  const c = $('#bCut'); if (!c) return;
  const showC = () => { c.textContent = S.schnitt ? '◧ Schnitt: an' : '◧ Schnitt: aus'; c.classList.toggle('on', !!S.schnitt); if (viewer) viewer.setCutaway(!!S.schnitt); };
  c.onclick = () => { S.schnitt = !S.schnitt; showC(); };
  showC();
}

/* ---------------- Eingetragene Luftschiffe (flotte.txt, vom Admin gepflegt) ----------------
   Je Zeile ein Speicher-Code; # = Kommentar. Unlesbare Zeilen werden übersprungen. */
let FLOTTE = [];
fetch('flotte.txt', { cache: 'no-cache' }).then(r => r.ok ? r.text() : '').then(t => {
  FLOTTE = t.split(/\r?\n/).map(z => z.trim()).filter(z => z && z[0] !== '#').map(safeDecode).filter(Boolean);
  if (FLOTTE.length && S.screen === 'auswahl') showAuswahl();
}).catch(() => {});

/* ---------------- 7. Start ---------------- */
showAuswahl();
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
<script type="module">
  // 3D-Vorschau als Modul laden und der App bekannt machen
  import { createViewer } from './viewer.js';
  window.LSView = { createViewer };
  window.dispatchEvent(new Event('lsview'));
</script>
